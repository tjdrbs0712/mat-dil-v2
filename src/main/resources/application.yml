spring:
  datasource:
    url: ${DATASOURCE_URL}
    username: ${DATASOURCE_USERNAME}
    password: ${DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        show_sql: true
        format_sql: true
        use_sql_comments: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  security:
    user:
      name: none
      password: none
  mail:
    host: smtp.gmail.com
    port: ${MAIL_PORT}
    username: ${GOOGLE_ID}
    password: ${GOOGLE_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  data:
    redis:
      host: localhost
      port: ${REDIS_PROT}
    cache:
      type: redis
logging:
  level:
    org.hibernate.SQL: debug             # SQL 출력
    org.hibernate.orm.jdbc.bind: trace   # 바인딩 파라미터 출력

jwt:
  secret: ${JWT_SECRET_KEY}
  expiration: 3600000
  refreshExpirationMillis: 36000000
server:
  port: ${SERVER_PORT}

decorator:
  datasource:
    p6spy:
      enable-logging: true
