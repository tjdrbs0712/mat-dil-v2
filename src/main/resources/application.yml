spring:
  datasource:
    url: ${DATASOURCE_URL}
    username: ${DATASOURCE_USERNAME}
    password: ${DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        show_sql: true
        format_sql: true
        use_sql_comments: true
  security:
    user:
      name: none
      password: none
jwt:
  secret: ${JWT_SECRET_KEY}
  expiration: 3600000
  refreshExpirationMillis: 36000000
server:
  port: ${SERVER_PORT}