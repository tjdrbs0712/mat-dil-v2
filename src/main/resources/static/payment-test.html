<!DOCTYPE html>
<html>
<head>
    <title>동적 결제 테스트 도우미</title>
    <meta charset="UTF-8">
    <script src="https://cdn.iamport.kr/v2/iamport.js"></script>
</head>
<body>
<h1>동적 결제 테스트</h1>
<p>1단계에서 생성된 주문 정보를 아래에 입력하세요.</p>
<div>
    <label for="orderId">주문 ID:</label>
    <input type="text" id="orderId" placeholder="예: 789">
</div>
<div>
    <label for="amount">결제 금액:</label>
    <input type="text" id="amount" placeholder="예: 17500">
</div>
<br>
<button onclick="prepareAndPay()">결제창 열기</button>

<script>
    const IMP = window.IMP;
    IMP.init("test_ck_lpP2YxJ4K877JAdv7KX8RGZwXLOb");

    async function prepareAndPay() {
        // 입력 필드에서 값을 읽어옵니다.
        const orderId = document.getElementById('orderId').value;
        const amount = document.getElementById('amount').value;

        if (!orderId || !amount) {
            alert('주문 ID와 금액을 모두 입력해주세요.');
            return;
        }

        console.log(`1. 주문 ID(${orderId})에 대한 결제 준비 요청...`);
        const response = await fetch('/api/v1/payments/prepare', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                orderId: parseInt(orderId), // 입력값을 숫자로 변환
                pg: 'tosspayments.test-tosstest'
            })
        });
        const prepData = await response.json();
        console.log("서버 응답:", prepData);

        // ✨ 서버가 내려준 금액과 내가 입력한 금액이 같은지 한번 더 확인 (보안)
        if (parseInt(amount) !== prepData.amount) {
            alert(`금액이 일치하지 않습니다. 입력된 금액: ${amount}, 서버가 계산한 금액: ${prepData.amount}`);
            return;
        }

        console.log("2. 결제창 호출...");
        IMP.request_pay({
            pg: prepData.pgProvider,
            merchant_uid: prepData.paymentId,
            name: `주문번호 ${orderId} 결제`,
            amount: prepData.amount, // ✨ 실제 서버가 계산한 금액으로 결제 요청
            buyer_name: '백엔드개발자'
        }, rsp => {
            console.log("결제창 콜백 결과:", rsp);
            if (rsp.success) {
                console.log("✅ 인증 성공!");
                console.log("🚀 Postman에 사용할 데이터 👇");
                console.log("imp_uid:", rsp.imp_uid);
                console.log("merchant_uid:", rsp.merchant_uid);
                alert(`인증 성공! 콘솔(F12)에서 imp_uid와 merchant_uid를 복사하세요.`);
            } else {
                alert(`인증 실패: ${rsp.error_msg}`);
            }
        });
    }
</script>
</body>
</html>
