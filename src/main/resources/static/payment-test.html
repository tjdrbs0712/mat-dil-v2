<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>포트원 V2 동적 결제 테스트</title>
    <script src="https://cdn.portone.io/v2/browser-sdk.js"></script>
</head>
<body>
<h1>포트원 V2 동적 결제 테스트</h1>

<div>
    <label for="orderId">주문 ID:</label>
    <input type="text" id="orderId" placeholder="예: 789">
</div>
<div>
    <label for="amount">결제 금액:</label>
    <input type="text" id="amount" placeholder="예: 17500">
</div>

<br>
<p>2. 결제 수단을 선택하세요.</p>
<button onclick="pay('KAKAO_PAY')">카카오페이</button>
<button onclick="pay('NAVER_PAY')">네이버페이</button>
<button onclick="pay('TOSS_PAY')">토스페이</button>

<script>
    async function pay(easyPayMethod) {
        const PortOne = window.PortOne;
        if (!PortOne) {
            alert("❌ 포트원 V2 SDK가 로딩되지 않았습니다.");
            return;
        }

        const orderId = document.getElementById("orderId").value;
        const inputAmount = parseInt(document.getElementById("amount").value);

        if (!orderId || isNaN(inputAmount)) {
            alert("주문 ID와 금액을 정확히 입력해주세요.");
            return;
        }

        try {
            const res = await fetch("/api/v2/payments/prepare", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    orderId: parseInt(orderId),
                    method: easyPayMethod  // 서버에서 pgProvider를 결정할 때 사용
                })
            });

            if (!res.ok) throw new Error("결제 준비 API 호출 실패");
            const prepData = await res.json();
            console.log("🔥 prepData 전체 확인:", prepData);

            const { paymentId, amount: serverAmount, pgProvider, clientKey } = prepData.data;

            if (inputAmount !== Number(serverAmount)) {
                alert(`금액 불일치! 입력: ${inputAmount}, 서버: ${serverAmount}`);
                return;
            }

            console.log({
                payMethod: "EASY_PAY",
                easyPay: { provider: easyPayMethod },
                pg: pgProvider
            });

            const response = await PortOne.requestPayment({
                storeId: "store-ec1eda24-01b1-4455-88b7-b9523e091b6d",
                channelKey: "channel-key-6489e02d-6719-4f70-a174-e95ad243e918",
                paymentId: paymentId.toString(),
                orderName: `주문번호 ${orderId} 결제`,
                totalAmount: serverAmount,
                currency: "KRW",
                payMethod: "CARD",
                easyPay: { provider: "KAKAO_PAY" },
                pg: "tosspayments.card",
                customer: {
                    fullName: "백엔드개발자"
                }
            });

            console.log("✅ 결제 완료", response);
            alert("결제 완료! 콘솔을 확인하세요.");

        } catch (err) {
            console.error("❌ 결제 실패:", err);
            alert("결제 실패: " + err.message);
        }
    }
</script>
</body>
</html>
